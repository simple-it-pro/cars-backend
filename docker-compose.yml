services:
  postgres-cars:
    container_name: postgres-cars
    image: postgres:17
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "5462:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis-cars:
    container_name: redis-cars
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  cars-migrations:
    build: 
      context: .
      dockerfile: ./Dockerfile.Migrations
    container_name: cars-migrations
    depends_on:
      - postgres-cars
    restart: no
    env_file:
      - .env.production
    command: ["npm", "run", "migration:run"]

  cars-backend:
    container_name: cars-backend
    image: vadimfrolovsimple/autosaloon-back:latest
    # uncomment if you need build from local, and comment "image"
    # build:
      # context: .
      # dockerfile: ./Dockerfile
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    depends_on:
      - postgres-cars
      - cars-migrations
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt/live/simpleit-gitlab.ru/fullchain.pem:/app/ssl/certs/fullchain.pem:ro
      - /etc/letsencrypt/live/simpleit-gitlab.ru/privkey.pem:/app/ssl/private/privkey.pem:ro
    labels:
      - "com.ouroboros.enable=true"
  
  # Ouroboros — перезапускает контейнеры при обновлении образа
  ouroboros:
    image: pyouroboros/ouroboros
    container_name: ouroboros
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker:/root/.docker
    environment:
      - TZ=Europe/Moscow
      - INTERVAL=300                         # каждые 5 минут (в секундах)
      - CLEANUP=true
      - LOG_LEVEL=info
      - SELF_UPDATE=false
      - RUN_ONCE=false
      # - IGNORE_TAGS=latest
      - DOCKER_USERNAME=${DOCKER_USERNAME}
      - DOCKER_PASSWORD=${DOCKER_PASSWORD}
      - LABEL_ENABLE=true
      - LABELS_ONLY=true
    restart: unless-stopped

networks:
  default:
    driver: bridge
    driver_opts:
      # нужно для того, чтобы корректно устанавливались зависимости во время билда
      com.docker.network.driver.mtu: 1428

volumes:
  postgres_data:
  redis_data:
