image: docker:25.0.3

services:
  - docker:25.0.3-dind

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: "vadimfrolovsimple/autosaloon-back"
  IMAGE_TAG: "latest"

stages:
  - build

build_and_push_image:
  stage: build
  only:
    - dev
  script:
    # Быстрая проверка, что переменные заданы
    - '[ -n "$DOCKERHUB_USERNAME" ] || { echo "ERROR: DOCKERHUB_USERNAME is empty"; exit 1; }'
    - '[ -n "$DOCKERHUB_PASSWORD" ] || { echo "ERROR: DOCKERHUB_PASSWORD is empty"; exit 1; }'

    - echo "Login to Docker Hub..."
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

    - echo "Build Docker image..."
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" .

    - echo "Push Docker image to Docker Hub..."
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
